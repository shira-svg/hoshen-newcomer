<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ברוכים הבאים לקהילת החושן</title>
<style>
  :root {
    --bg: #f6f1e9;
    --card: #ffffff;
    --ink: #2b2a33;
    --muted: #6b6878;
    --brand: #17345e;
    --brand-dark: #17345e;
    --accent: #e08a2e;
    --line: #e3dccf;
    --error: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Heebo", "Assistant", "Segoe UI", Arial, sans-serif;
    line-height: 1.6;
  }
  header {
    background: #fff;
    color: var(--brand);
    text-align: center;
    padding: 22px 20px 44px;
    border-bottom: 5px solid transparent;
    border-image: linear-gradient(to left, #e08a2e, #3a7fc1, #d9558a, #7fb347, #f0d12c, #17345e) 1;
  }
  header img { width: 150px; height: auto; display: block; margin: 0 auto 10px; }
  header h1 { margin: 0 0 8px; font-size: 2rem; }
  header p { margin: 0 auto; max-width: 560px; font-size: 1.05rem; color: var(--muted); }
  main { max-width: 680px; margin: -18px auto 40px; padding: 0 16px; }
  .card {
    background: var(--card);
    border-radius: 14px;
    padding: 22px 22px 8px;
    margin-bottom: 16px;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
  }
  .card h2 {
    margin: 0 0 14px;
    font-size: 1.15rem;
    color: var(--brand-dark);
    border-bottom: 2px solid var(--line);
    padding-bottom: 8px;
  }
  label { display: block; font-weight: 600; margin-bottom: 4px; }
  .hint { color: var(--muted); font-size: .9rem; font-weight: 400; }
  .field { margin-bottom: 18px; }
  input[type=text], input[type=number], textarea {
    width: 100%;
    padding: 11px 12px;
    font: inherit;
    border: 1.5px solid var(--line);
    border-radius: 9px;
    background: #fdfcfa;
    color: var(--ink);
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(23,52,94,.18);
  }
  textarea { min-height: 84px; resize: vertical; }
  .member {
    display: grid;
    grid-template-columns: 1.2fr 1.2fr .7fr auto;
    gap: 8px;
    margin-bottom: 8px;
    align-items: center;
  }
  .member button {
    background: none; border: none; color: var(--error);
    font-size: 1.4rem; cursor: pointer; padding: 0 6px;
  }
  .member button[hidden] { visibility: hidden; display: block; }
  .add-btn {
    background: none;
    border: 1.5px dashed var(--brand);
    color: var(--brand);
    border-radius: 9px;
    padding: 9px 14px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 18px;
  }
  .add-btn:hover { background: #eef2f8; }
  .submit {
    display: block; width: 100%;
    background: var(--accent); color: #fff;
    border: none; border-radius: 12px;
    padding: 15px; font: inherit; font-size: 1.15rem; font-weight: 700;
    cursor: pointer;
  }
  .submit:hover { background: #c97a24; }
  .submit:disabled { opacity: .6; cursor: wait; }
  .error { color: var(--error); font-weight: 600; margin: 10px 0; display: none; }
  .thanks {
    display: none;
    text-align: center;
    background: var(--card);
    border-radius: 14px;
    padding: 40px 24px;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
  }
  .thanks h2 { color: var(--brand-dark); margin-top: 0; }
  .hp { position: absolute; left: -9999px; height: 0; overflow: hidden; }
  @media (max-width: 520px) {
    .member { grid-template-columns: 1fr 1fr; }
    .member .age { grid-column: 1 / 2; }
    .member button { justify-self: start; }
  }
</style>
</head>

  <h1 id="pageTitle">ברוכים הבאים לקהילת החושן</h1>

<main>
  <form id="form" novalidate>
    <div class="hp"><label>אל תמלאו שדה זה<input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>

    <div class="card">
      <h2>מי אתם</h2>
      <div class="field">
        <label for="familyName">שם המשפחה</label>
        <input type="text" id="familyName" name="familyName" required>
      </div>
      <div class="field">
        <label>שמות וגילאים <span class="hint">(של כל מי שגר בבית, גם הילדים)</span></label>
        <div id="members"></div>
        <button type="button" class="add-btn" id="addMember">+ הוספת בן או בת משפחה</button>
      </div>
    </div>

    <div class="card">
      <h2>קצת עליכם</h2>
      <div class="field">
        <label for="occupation">במה אתם עוסקים?</label>
        <textarea id="occupation" name="occupation"></textarea>
      </div>
      <div class="field">
        <label for="inHarish">כמה זמן אתם בחריש, ומאיפה הגעתם?</label>
        <textarea id="inHarish" name="inHarish"></textarea>
      </div>
      <div class="field">
        <label for="howMet">איך הכרתם?</label>
        <textarea id="howMet" name="howMet"></textarea>
      </div>
      <div class="field">
        <label for="loves">מה אתם הכי אוהבים לעשות?</label>
        <textarea id="loves" name="loves"></textarea>
      </div>
      <div class="field">
        <label for="service">איפה שירתתם?</label>
        <textarea id="service" name="service"></textarea>
      </div>
    </div>

    <div class="card">
      <h2>הצד האישי</h2>
      <div class="field">
        <label for="inspiration">דמות או אישיות שהיא השראה אצלכם</label>
        <textarea id="inspiration" name="inspiration"></textarea>
      </div>
      <div class="field">
        <label for="secret">משהו שאנחנו לא יודעים עליכם <span class="hint">(אפשר ללכת עד הילדות, חדר של חני, פדיחה, כל דבר)</span></label>
        <textarea id="secret" name="secret"></textarea>
      </div>
      <div class="field">
        <label for="motto">משפט או מוטו לחיים</label>
        <textarea id="motto" name="motto"></textarea>
      </div>
    </div>

    <div class="card">
      <h2>תמונה</h2>
      <div class="field">
        <label for="photo">תמונה של המשפחה או הזוג <span class="hint">(חובה, תמונה אחת שבה רואים את כולם)</span></label>
        <input type="file" id="photo" accept="image/*">
        <img id="preview" alt="תצוגה מקדימה של התמונה" style="display:none;max-width:100%;max-height:260px;margin-top:10px;border-radius:10px;border:1.5px solid var(--line)">
      </div>
    </div>

    <button type="button" class="add-btn" id="testFill" style="display:none;width:100%">מילוי אוטומטי לבדיקה</button>
    <div class="error" id="error"></div>
    <button type="submit" class="submit" id="submitBtn">שליחה</button>
  </form>

  <div class="thanks" id="thanks">
    <h2>קיבלנו את הטופס שמילאתם, תודה רבה</h2>
  </div>
</main>

<script>
  // הדביקו כאן את כתובת ה-Web App שקיבלתם מ-Apps Script אחרי הפריסה
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyMP4g8EOvvZ2hO-yMp5XVmVrkcdDPuJoX7TlUf53jsEWfv6tK7kSW0U1f9UvVAnpop/exec";

  const membersEl = document.getElementById("members");
  const form = document.getElementById("form");
  const errorEl = document.getElementById("error");
  const submitBtn = document.getElementById("submitBtn");

  function addMember() {
    const row = document.createElement("div");
    row.className = "member";
    row.innerHTML =
      '<input type="text" class="m-first" placeholder="שם פרטי" aria-label="שם פרטי">' +
      '<input type="text" class="m-last" placeholder="שם משפחה" aria-label="שם משפחה">' +
      '<input type="number" class="m-age age" placeholder="גיל" min="0" max="120" aria-label="גיל">' +
      '<button type="button" aria-label="הסרה" title="הסרה">×</button>';
    row.querySelector("button").addEventListener("click", function () {
      row.remove();
      refreshRemoveButtons();
    });
    membersEl.appendChild(row);
    refreshRemoveButtons();
  }

  function refreshRemoveButtons() {
    const rows = membersEl.querySelectorAll(".member");
    rows.forEach(function (r) {
      r.querySelector("button").hidden = rows.length === 1;
    });
  }

  document.getElementById("addMember").addEventListener("click", addMember);
  addMember();
  addMember();

  function collectMembers() {
    const list = [];
    membersEl.querySelectorAll(".member").forEach(function (r) {
      const first = r.querySelector(".m-first").value.trim();
      const last = r.querySelector(".m-last").value.trim();
      const age = r.querySelector(".m-age").value.trim();
      if (first || last) {
        list.push((first + " " + last).trim() + (age ? " (גיל " + age + ")" : ""));
      }
    });
    return list.join("\n");
  }

  // הקטנת התמונה לפני השליחה, כדי שתעלה מהר גם מהנייד
  let photoData = "";
  const photoInput = document.getElementById("photo");
  const previewEl = document.getElementById("preview");
  photoInput.addEventListener("change", function () {
    photoData = "";
    previewEl.style.display = "none";
    const file = photoInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function (ev) {
      const img = new Image();
      img.onload = function () {
        const max = 1000;
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        photoData = canvas.toDataURL("image/jpeg", 0.8);
        previewEl.src = photoData;
        previewEl.style.display = "block";
      };
      img.onerror = function () {
        errorEl.textContent = "לא הצלחנו לקרוא את התמונה. נסו קובץ אחר.";
        errorEl.style.display = "block";
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  // ===== מילוי אוטומטי לבדיקה =====
  // לכיבוי הכפתור לפני פרסום הטופס, שנו ל-false
  const SHOW_TEST_BUTTON = true;
  const SAMPLES = [
    { fam: "כהן", m: [["דנה","כהן","38"],["יובל","כהן","40"],["נועם","כהן","9"],["שיר","כהן","6"]], color: "#3a7fc1",
      occ: "דנה מורה לחינוך מיוחד, יובל מהנדס תוכנה", hr: "שנה וחצי בחריש, הגענו מרעננה", met: "הכרנו בשבת באוניברסיטה, ליד מכונת הקפה",
      loves: "טיולים משפחתיים ומשחקי קופסה", svc: "דנה בחינוך, יובל בחיל האוויר", insp: "אמא של דנה, שמצליחה לשמור על חיוך בכל מצב", secret: "יובל מנגן בחליל צד", motto: "כל יום הוא הזדמנות להתחיל מחדש" },
    { fam: "לוי", m: [["רונית","לוי","45"],["אבי","לוי","47"],["מאיה","לוי","15"]], color: "#d9558a",
      occ: "רונית רופאת ילדים, אבי רואה חשבון", hr: "חמש שנים בחריש, מקיבוץ בגליל", met: "בטיול שנתי בכיתה י'",
      loves: "ריקודי עם ואפייה", svc: "אבי בשריון, רונית בנחל", insp: "רות בדר גינזבורג", secret: "בילדות הסתתרתי בחדר של חני ואף אחד לא מצא אותי", motto: "מה שחשוב באמת לא נמדד" }
  ];
  let sampleIdx = 0;

  function fakePhoto(text, color) {
    const c = document.createElement("canvas");
    c.width = 800; c.height = 600;
    const g = c.getContext("2d");
    g.fillStyle = color; g.fillRect(0, 0, 800, 600);
    g.fillStyle = "#fff"; g.font = "bold 64px Arial"; g.textAlign = "center";
    g.fillText("תמונת בדיקה", 400, 280);
    g.font = "48px Arial"; g.fillText("משפחת " + text, 400, 360);
    return c.toDataURL("image/jpeg", 0.8);
  }

  const testBtn = document.getElementById("testFill");
  if (SHOW_TEST_BUTTON) testBtn.style.display = "block";
  testBtn.addEventListener("click", function () {
    const s = SAMPLES[sampleIdx % SAMPLES.length];
    sampleIdx++;
    form.familyName.value = s.fam;
    membersEl.innerHTML = "";
    s.m.forEach(function (p) {
      addMember();
      const r = membersEl.lastElementChild;
      r.querySelector(".m-first").value = p[0];
      r.querySelector(".m-last").value = p[1];
      r.querySelector(".m-age").value = p[2];
    });
    form.occupation.value = s.occ;
    form.inHarish.value = s.hr;
    form.howMet.value = s.met;
    form.loves.value = s.loves;
    form.service.value = s.svc;
    form.inspiration.value = s.insp;
    form.secret.value = s.secret;
    form.motto.value = s.motto;
    photoData = fakePhoto(s.fam, s.color);
    previewEl.src = photoData;
    previewEl.style.display = "block";
    errorEl.style.display = "none";
  });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    errorEl.style.display = "none";

    if (!photoData) {
      errorEl.textContent = "נא להעלות תמונה של המשפחה או הזוג.";
      errorEl.style.display = "block";
      return;
    }

    const members = collectMembers();
    const familyName = form.familyName.value.trim();
    if (!familyName || !members) {
      errorEl.textContent = "נא למלא את שם המשפחה ולפחות שם אחד.";
      errorEl.style.display = "block";
      return;
    }
    if (WEB_APP_URL.indexOf("PASTE_") === 0) {
      errorEl.textContent = "הטופס עדיין לא חובר לגיליון. יש להדביק את כתובת ה-Web App בקוד.";
      errorEl.style.display = "block";
      return;
    }

    const data = new URLSearchParams();
    data.append("website", form.website.value);
    data.append("familyName", familyName);
    data.append("members", members);
    data.append("photo", photoData);
    ["occupation", "inHarish", "howMet", "loves", "service", "inspiration", "secret", "motto"]
      .forEach(function (k) { data.append(k, form[k].value.trim()); });

    submitBtn.disabled = true;
    submitBtn.textContent = "שולח...";

    fetch(WEB_APP_URL, { method: "POST", mode: "no-cors", body: data })
      .then(function () {
        document.getElementById("pageTitle").textContent = "משפחת " + familyName + " ברוכים הבאים!";
        document.getElementById("pageSub").style.display = "none";
        form.style.display = "none";
        document.getElementById("thanks").style.display = "block";
        window.scrollTo({ top: 0, behavior: "smooth" });
      })
      .catch(function () {
        submitBtn.disabled = false;
        submitBtn.textContent = "שליחה";
        errorEl.textContent = "משהו השתבש בשליחה. נסו שוב בעוד רגע.";
        errorEl.style.display = "block";
      });
  });
</script>
</body>
</html>
